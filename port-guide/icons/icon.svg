<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3f5f"/><stop offset="1" stop-color="#0b1a2b"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7efdc"/><stop offset="1" stop-color="#eadcbc"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3d2ad"/><stop offset="1" stop-color="#f3e8cf"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f26b43"/><stop offset="1" stop-color="#c8401d"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- aurora wisp -->
  <path d="M-40 250 C 220 120, 520 300, 1064 140 L1064 60 C 600 200, 260 40, -40 170 Z" fill="#46d39a" opacity=".22"/>
  <path d="M-40 300 C 260 200, 560 360, 1064 230 L1064 190 C 600 300, 300 150, -40 260 Z" fill="#7fe0c0" opacity=".14"/>
  <!-- folded map, three panels -->
  <g filter="url(#sh)">
    <path d="M190 330 L400 280 L400 790 L190 840 Z" fill="url(#p1)"/>
    <path d="M400 280 L620 330 L620 840 L400 790 Z" fill="url(#p2)"/>
    <path d="M620 330 L834 280 L834 790 L620 840 Z" fill="url(#p1)"/>
  </g>
  <!-- sea and coastline on the map -->
  <path d="M190 560 C 260 540, 300 600, 360 580 C 420 560, 430 640, 500 640 C 560 640, 580 700, 620 690 L620 840 L400 790 L190 840 Z" fill="#8fc1c9" opacity=".75"/>
  <path d="M620 690 C 680 680, 720 740, 834 720 L834 790 L620 840 Z" fill="#8fc1c9" opacity=".75"/>
  <!-- walking route: dotted -->
  <path d="M300 650 C 330 560, 420 520, 470 470 S 600 420, 660 470" fill="none" stroke="#0f2236" stroke-width="18" stroke-linecap="round" stroke-dasharray="2 38"/>
  <!-- anchor at the pier -->
  <g transform="translate(300 690)" fill="none" stroke="#0f2236" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-72" r="14"/>
    <line x1="0" y1="-58" x2="0" y2="26"/>
    <line x1="-26" y1="-40" x2="26" y2="-40"/>
    <path d="M-44 0 C -40 26, -20 30, 0 30 C 20 30, 40 26, 44 0"/>
  </g>
  <!-- map pin -->
  <g transform="translate(664 300)" filter="url(#sh)">
    <path d="M0 200 C -30 150, -100 90, -100 10 A100 100 0 0 1 100 10 C 100 90, 30 150, 0 200 Z" fill="url(#pin)"/>
    <circle cx="0" cy="8" r="40" fill="#fbf3e2"/>
  </g>
</svg>
