name: The Hour Between iPhone app

on:
  push:
    branches: [main]
    paths: ["hour-between/**", "port-guide/data/**", "native/hour-between/**", "tests/hour.test.js", ".github/workflows/hour-between-ios.yml"]
  # Pull requests run the tests and the build only; nothing is published until the change is on main.
  pull_request:
    paths: ["hour-between/**", "port-guide/data/**", "native/hour-between/**", "tests/hour.test.js", ".github/workflows/hour-between-ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the planner logic
        run: node tests/hour.test.js

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Create the Xcode project
        working-directory: native/hour-between
        run: xcodegen generate

      - name: Run tests and take screenshots on an iPhone simulator
        working-directory: native/hour-between
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "::notice::Simulator: $DEVICE"
          xcodebuild test -project HourBetween.xcodeproj -scheme HourBetween \
            -destination "platform=iOS Simulator,name=$DEVICE" -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -E "Executed [0-9]+ test" test.log | sort -u | while IFS= read -r l; do echo "::notice::$l"; done
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" test.log; then
            grep -E "error:|: error|failed|xcodebuild: error" test.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Publish screenshots to the ci-screenshots-hour-between branch
        if: always() && github.event_name != 'pull_request'
        working-directory: native/hour-between
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d TestResults.xcresult ] || exit 0
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || true
          cd shots
          git init -q -b ci-screenshots-hour-between
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots-hour-between

      - name: Build for iPhone (unsigned)
        working-directory: native/hour-between
        run: |
          xcodebuild build -project HourBetween.xcodeproj -scheme HourBetween \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Package the .ipa
        working-directory: native/hour-between
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/HourBetween.app Payload/
          zip -qry Hour-Between.ipa Payload && ls -l Hour-Between.ipa

      - name: Publish the .ipa (always at the same download link)
        if: github.event_name != 'pull_request'
        working-directory: native/hour-between
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hour-between-latest --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create hour-between-latest Hour-Between.ipa --repo "${{ github.repository }}" \
            --title "The Hour Between (build ${{ github.run_number }})" --latest=false \
            --notes "Download Hour-Between.ipa below and install it with Sideloadly. Built from commit ${GITHUB_SHA:0:7}."
