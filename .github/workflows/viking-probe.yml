name: Viking probe (one-off)
on:
  push:
    branches: [viking-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: ONLY=rhine-and-main-explorer,in-search-of-northern-lights,rhine-getaway,iberian-explorer,antarctic-explorer OUT=probe-out node tools/build_viking_catalog.mjs 2>&1 | tee probe-out-log.txt || true
      - name: Save results to the viking-probe-out branch
        run: |
          mkdir -p probe-out && cp probe-out-log.txt probe-out/ && cd probe-out && git init -q -b viking-probe-out
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "probe ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" viking-probe-out
