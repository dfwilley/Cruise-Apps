name: Port data

on:
  push:
    branches: [main]
    paths: ["tools/build_ports.py", "port-guide/data/ports.json", ".github/workflows/port-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download OpenStreetMap extracts (Geofabrik)
        run: |
          mkdir -p osm && cd osm
          get() {
            n=$1; shift
            for r in "$@"; do
              if curl -fsSL --retry 2 -o "$n-latest.osm.pbf" "https://download.geofabrik.de/$r-latest.osm.pbf"; then
                echo "::notice::Downloaded $r ($(du -h "$n-latest.osm.pbf" | cut -f1))"; return 0; fi
            done
            rm -f "$n-latest.osm.pbf"; echo "::warning::Couldn't download $n; skipping it"
          }
          get norway europe/norway
          get scotland europe/united-kingdom/scotland europe/great-britain/scotland
          get london europe/united-kingdom/england/greater-london europe/great-britain/england/greater-london
          get essex europe/united-kingdom/england/essex europe/great-britain/england/essex
      - name: Keep only sights and practical places
        run: |
          cd osm
          for f in *-latest.osm.pbf; do
            b=${f%-latest.osm.pbf}
            osmium tags-filter "$f" nwr/tourism=museum,gallery,viewpoint,attraction,information nwr/historic nwr/amenity=place_of_worship,pharmacy,atm,bank,toilets,taxi,ferry_terminal \
              nwr/shop=supermarket,convenience,mall,department_store,outdoor,sports nwr/railway=station,halt nwr/aerialway=station nwr/man_made=pier,quay nwr/harbour nwr/landuse=port nwr/seamark:type=harbour \
              -o "$b-f.pbf" --overwrite
            osmium export "$b-f.pbf" -f geojsonseq -o "$b.geojsonseq" --overwrite
            echo "$b: $(wc -l < $b.geojsonseq) features"
          done
      - name: Build the port data file
        run: python3 tools/build_ports.py osm/*.geojsonseq
      - name: Save it to the repository
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add port-guide/data/places.json port-guide/data/places.js port-guide/data/ports.js
          git commit -m "Update port data from OpenStreetMap and Open-Meteo" || echo "No change"
          git pull --rebase origin main && git push origin HEAD:main
