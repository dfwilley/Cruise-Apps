name: Build iPhone app

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "index.html"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test the forecast logic
        run: node tests/arctic.test.js

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Run tests and take screenshots on an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | head -1 | sed -E 's/^[[:space:]]+//; s/ \(.*//')
          echo "::notice::Simulator: $DEVICE"
          xcodebuild test \
            -project ArcticNight.xcodeproj -scheme ArcticNight \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -E "Test Suite .*(passed|failed)|Executed [0-9]+ test" test.log | sort -u | while IFS= read -r l; do echo "::notice::$l"; done
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" test.log; then
            grep -E "error:|: error|failed|xcodebuild: error" test.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d TestResults.xcresult ] || exit 0
          mkdir -p shots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path shots || true
          ls shots | head -40
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots from run ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project ArcticNight.xcodeproj -scheme ArcticNight \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            grep -E "error:" build.log | sort -u | head -10 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ArcticNight.app Payload/
          zip -qry Arctic-Night.ipa Payload
          ls -l Arctic-Night.ipa

      - name: Publish the .ipa as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Arctic-Night.ipa \
            --repo "${{ github.repository }}" \
            --title "Arctic Night (build ${{ github.run_number }})" \
            --notes "Download Arctic-Night.ipa below and install it with Sideloadly. Built from commit ${GITHUB_SHA:0:7}." \
            --latest
