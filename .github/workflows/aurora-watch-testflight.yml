name: Arctic Night (Aurora Watch) - upload to TestFlight

# Builds a signed copy of the app and uploads it to App Store Connect, where it
# shows up in TestFlight for you and anyone in your internal testing group.
# Signs with a temporary certificate made through the API key (revoked after upload).
# Needs these repository secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID.

on:
  push:
    branches: [main]
    paths:
      - 'aurora-watch/**'
      - 'native/aurora-watch/**'
      - '.github/workflows/aurora-watch-testflight.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: native/aurora-watch

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: com.dfwilley.arcticnight
      APP_NAME: Arctic Night
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the four Apple secrets are present
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "All four secrets are present."

      - name: Show tool versions
        run: |
          sw_vers
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Save the API key where Xcode looks for it
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY_PATH"
          head -1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY' && echo 'Key file looks right.' || echo '::warning::Key file does not start with BEGIN PRIVATE KEY'
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # Trim stray spaces/line breaks that come along when secrets are pasted
          echo "TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Register bundle ID and confirm the App Store Connect app record
        run: |
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]"
          python3 ../../.github/scripts/asc_precheck.py "$BUNDLE_ID" "$APP_NAME"

      - name: Create temporary signing certificate and profile
        run: python3 ../../.github/scripts/asc_signing.py create "$BUNDLE_ID" "$RUNNER_TEMP/signing"

      - name: Install the certificate and profile on the build machine
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/signing/signing.p12" -k "$KC" \
            -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/signing/profile.mobileprovision" "$d/$SIGN_PROFILE_UUID.mobileprovision"
          done
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Build the signed app archive
        run: |
          xcodebuild archive \
            -project ArcticNight.xcodeproj \
            -scheme ArcticNight \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/ArcticNight.xcarchive \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 1000 )) \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$SIGN_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC"

      - name: Export the .ipa file
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${SIGN_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ArcticNight.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export
          ls -la build/export

      - name: Upload to App Store Connect
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys" xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Uploaded build $(( ${{ github.run_number }} + 1000 )). Apple takes about 5-30 minutes to process it before it appears in TestFlight."

      - name: Revoke the temporary certificate and profile
        if: always()
        run: python3 ../../.github/scripts/asc_signing.py cleanup

      - name: Remove key files and keychain
        if: always()
        run: |
          [ -n "$KC" ] && security delete-keychain "$KC" || true
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/signing"
